name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Generate corpus (seeded, deterministic)
        run: python -m parser_assurance.scripts.generate_corpus
      - name: Run tests
        run: pytest
      - name: Smoke test (end-to-end demo must exit 0)
        run: python -m parser_assurance
      - name: replay-check catches the drift in the example stream (must exit 1)
        run: |
          set +e
          replay-check examples/claude_drift.jsonl
          test $? -eq 1
